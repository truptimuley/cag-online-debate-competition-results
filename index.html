<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Download Your PDF</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 50px;
        text-align: center;
      }
      .form-container {
        max-width: 300px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      input,
      button {
        padding: 10px;
        font-size: 16px;
      }
      button {
        background: #007bff;
        color: white;
        border: none;
        cursor: pointer;
      }
      #message {
        margin-top: 15px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <h2>Enter details to access your PDF</h2>
    <div class="form-container">
      <input type="text" id="name" placeholder="Full Name" required />
      <input type="text" id="phone" placeholder="Phone Number" required />
      <button onclick="checkDatabase()">Submit</button>
    </div>
    <div id="message"></div>

    <script>
      function checkDatabase() {
        const name = document.getElementById("name").value;
        const phone = document.getElementById("phone").value;
        const messageDiv = document.getElementById("message");

        messageDiv.innerText = "Checking...";

        // REPLACE THIS WITH YOUR GOOGLE APPS SCRIPT WEB APP URL
        const scriptUrl =
          "https://script.google.com/macros/s/AKfycbz9t9SGyspFbkQKVykSpvsqly1z71d88pmQ-cCGO34izrHKz7fbFFeQqEy8S1tHHOFmDQ/exec";

        fetch(scriptUrl, {
          method: "POST",
          body: JSON.stringify({ name: name, phone: phone }),
        })
          .then((res) => res.json())
          .then((response) => {
            if (response.status === "success") {
              messageDiv.innerHTML =
                "<span style='color:green;'>Match found! Downloading...</span>";
              // Automatically trigger the PDF download/open
              window.open(response.pdf, "_blank");
            } else {
              messageDiv.innerHTML =
                "<span style='color:red;'>No match found. Please try again.</span>";
            }
          })
          .catch((err) => {
            messageDiv.innerText = "An error occurred. Try again.";
            console.error(err);
          });
      }
    </script>
  </body>
</html>
